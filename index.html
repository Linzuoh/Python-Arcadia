<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />
  <title>Python Arcádia</title>
  <link rel="stylesheet" href="styles.css?v=71" />
</head>
<body>
  <div id="boot" class="boot"><div class="boot-mark">A</div><div><strong>Python Arcádia</strong><span>Preparando seu ambiente Python no navegador…</span></div></div>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <button class="brand" data-route="home"><span class="brand-mark">A</span><span><b>Python Arcádia</b><small>fluência em Python</small></span></button>
      <nav>
        <button data-route="home" class="nav-btn active"><span>◫</span> Jornada</button>
        <button data-route="daily" class="nav-btn"><span>☀</span> Desafio diário <em id="dailyBadge">1</em></button>
        <button data-route="practice" class="nav-btn"><span>⌁</span> Treino</button>
        <button data-route="review" class="nav-btn"><span>↻</span> Revisões <em id="reviewBadge">0</em></button>
        <button data-route="wiki" class="nav-btn"><span>⌘</span> Wiki</button>
        <button data-route="shop" class="nav-btn"><span>◇</span> Loja <em id="coinBadge">0</em></button>
        <button data-route="notebook" class="nav-btn"><span>▤</span> Caderno <em id="errorBadge">0</em></button>
        <button data-route="exams" class="nav-btn"><span>✓</span> Provas</button>
        <button data-route="progress" class="nav-btn"><span>↗</span> Maestria</button>
      </nav>
      <div class="sidebar-bottom">
        <div id="petDock" class="pet-dock hidden"></div>
        <div id="pyStatus" class="py-status">● Python carregando…</div>
        <div class="mini-progress"><span id="sideLevel">Nível 1</span><div><i id="sideBar"></i></div><small id="sideXp">0 XP</small></div>
        <button id="exportBtn" class="subtle-btn">Exportar progresso</button>
        <label class="subtle-btn file-label">Importar progresso<input id="importInput" type="file" accept="application/json"></label>
      </div>
    </aside>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="course-data.js?v=71"></script>
  <script src="v6-data.js?v=71"></script>
  <script src="app.js?v=71"></script>
  <script src="v6.js?v=71"></script>
  <script src="v7-data.js?v=71"></script>
  <script src="v7.js?v=71"></script>

  <script>
    // V7.1 fail-safe: a dependency or local JS error must never leave the course on an infinite boot screen.
    setTimeout(function(){
      var boot=document.getElementById('boot');
      var app=document.getElementById('app');
      if(boot && app && !boot.classList.contains('hidden') && app.classList.contains('hidden')){
        boot.classList.add('hidden');
        app.classList.remove('hidden');
        var view=document.getElementById('view');
        if(view) view.innerHTML='<div class="card"><span class="eyebrow">diagnóstico automático</span><h1>O curso não conseguiu iniciar.</h1><p>Um arquivo do site não carregou corretamente. Faça Ctrl + Shift + R. Se continuar, confira se os arquivos da atualização V7.1 estão na raiz do repositório.</p></div>';
        var st=document.getElementById('pyStatus');
        if(st) st.textContent='● inicialização incompleta · v7.1';
      }
    },1800);
  </script>
</body>
</html>
